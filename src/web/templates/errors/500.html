{% extends "base.html" %}

{% block title %}500 — Server Error{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 1.5rem; max-width: 600px; margin: 3rem auto;">
  <div style="font-size: 3.5rem; margin-bottom: 1rem;">💥</div>
  <h1 style="font-size: 2.2rem; font-weight: 800; color: var(--text-white); margin-bottom: 0.5rem;">500 - Internal Server Error</h1>
  <p style="color: var(--text-muted); font-size: 1.05rem; margin-bottom: 2rem;">
    Something unexpected went wrong on our end. The glitch has been noted in the console logs.
  </p>
  <a href="{{ url_for('main.index') }}" class="btn btn-brand">Return to Homepage</a>
</div>
{% endblock %}
